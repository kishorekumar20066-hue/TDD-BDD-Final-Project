apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source

  steps:
    - name: cleanup
      image: python:3.9
      script: |
        #!/bin/sh
        echo "Cleaning up..."
        find "$(workspaces.source.path)" -type d -name "__pycache__" -exec rm -rf {} +
        find "$(workspaces.source.path)" -type f -name "*.pyc" -delete
        echo "Cleanup completed successfully"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source

  steps:
    - name: test
      image: python:3.9
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        echo "Installing project dependencies..."

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install nose coverage

        echo "Running tests..."

        nosetests -vv --with-spec --spec-color --with-coverage --cover-package=service
