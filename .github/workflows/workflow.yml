
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install flake8 nose coverage

      - name: Run lint
        run: |
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          python -c "import collections, collections.abc; collections.Callable = collections.abc.Callable; import nose; nose.main(argv=['nosetests', '-vv', '--with-spec', '--spec-color', '--with-coverage', '--cover-package=service'])"
