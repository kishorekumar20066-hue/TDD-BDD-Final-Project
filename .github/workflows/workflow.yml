name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
       - name: Run lint
        run: flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: nosetests -vv --with-spec --spec-color --with-coverage --cover-package=service
